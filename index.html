<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BILAN · November 2026 Creative Review</title><meta name="robots" content="noindex,nofollow"><style>
:root{--orange:#f26123;--ink:#102942;--cream:#fff9f3;--line:#e8dfd7}*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f2ee;color:var(--ink)}header{background:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}.top{max-width:1280px;margin:auto;padding:15px 24px;display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.logo{font-weight:900;font-size:22px;color:var(--orange)}.logo span{color:var(--ink);font-size:13px;margin-left:10px;font-weight:600}.pill{background:#fff0e5;padding:7px 12px;border-radius:50px;color:#9b401a;font-size:12px}main{max-width:1280px;margin:auto;padding:30px 24px}.intro{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}.intro h1{font-size:clamp(27px,5vw,46px);letter-spacing:-1.5px;margin:0}.intro p{color:#687587;max-width:650px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}input,select,button,textarea{font:inherit;border:1px solid #dfd5cc;background:#fff;border-radius:9px;padding:11px 13px;color:#102942}input{min-width:230px;flex:1}button{cursor:pointer}button.active{background:var(--ink);color:white}#stats{font-size:13px;color:#67717c;margin-bottom:15px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:19px}.card{background:white;border:1px solid var(--line);border-radius:17px;overflow:hidden;display:flex;flex-direction:column}.card>img{width:100%;aspect-ratio:4/5;object-fit:cover;background:#eee8e3}.cardbody{padding:16px;display:flex;flex-direction:column;gap:9px;flex:1}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--orange);font-weight:750}.card h3{margin:0;font-size:19px;line-height:1.2}.card p{font-size:13px;color:#69747e;margin:0}.card button{background:var(--ink);color:white;border:none;margin-top:auto}dialog{width:min(1150px,98vw);max-height:95vh;border:0;border-radius:18px;padding:0;box-shadow:0 25px 100px #10294255}dialog::backdrop{background:#061726bd}.modalhead{position:sticky;top:0;background:white;z-index:2;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.modalmain{overflow-y:auto;max-height:calc(95vh - 67px);padding:20px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.pair img{width:100%;height:auto;border-radius:12px;box-shadow:0 0 0 1px #ddd}.slide{margin:0 0 30px}h4{margin:7px 0 12px}.copybox{padding:20px;border:1px solid var(--line);background:var(--cream);border-radius:12px;margin:12px 0}.label{font-size:12px;font-weight:800;color:var(--orange)}.scenes{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.scenes img{width:100%;border-radius:9px}.small{font-size:12px;color:#6e737a}.close{background:#fff2e9;color:var(--ink)}.review{width:100%;min-height:85px;resize:vertical}#export{background:var(--orange);color:white;border:0}@media(max-width:680px){.pair{grid-template-columns:1fr}main{padding:18px 12px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.cardbody{padding:11px}.card h3{font-size:15px}.card p{display:none}.modalmain{padding:12px}}
</style></head><body><header><div class="top"><div class="logo">BILAN <span>SIZE 4 · NOVEMBER 2026</span></div><span class="pill">CREATIVE REVIEW · NOT PUBLISHED</span></div></header><main><div class="intro"><div><h1>November Creative Review</h1><p>Compare original and revised posters side by side. Inspect every carousel slide, view Reel storyboard scenes, read the planned captions, and export your correction notes.</p></div><button id="export">Export correction notes (.csv)</button></div><div class="filters"><input id="q" placeholder="Search topic, date, caption…"><select id="format"><option value="all">All formats</option><option value="static">Static posters</option><option value="carousel">Carousels</option><option value="reel">Reels</option></select><select id="week"><option value="all">Full month</option><option value="1">1–7 Nov</option><option value="2">8–14 Nov</option><option value="3">15–21 Nov</option><option value="4">22–28 Nov</option><option value="5">29–30 Nov</option></select></div><div id="stats"></div><section id="cards" class="cards"></section></main><dialog id="modal"><div class="modalhead"><strong id="modalTitle"></strong><button class="close" onclick="modal.close()">Close ✕</button></div><div class="modalmain" id="modalBody"></div></dialog><script>window.BILAN_POSTS=[];</script><script src="data_00.js"></script><script src="data_01.js"></script><script src="data_02.js"></script><script src="data_03.js"></script><script src="data_04.js"></script><script src="data_05.js"></script><script src="data_06.js"></script><script src="data_07.js"></script><script src="data_08.js"></script><script src="data_09.js"></script><script src="data_10.js"></script><script src="data_11.js"></script><script src="data_12.js"></script><script src="data_13.js"></script><script src="data_14.js"></script><script>
const posts=window.BILAN_POSTS;const $=id=>document.getElementById(id);const notes={};function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')};function week(d){let n=Number(d.slice(-2));return n<8?1:n<15?2:n<22?3:n<29?4:5};function draw(){let q=$('q').value.toLowerCase(),f=$('format').value,w=$('week').value;let hits=posts.filter(p=>(f==='all'||p.format===f)&&(w==='all'||week(p.date)==w)&&JSON.stringify([p.id,p.date,p.title,p.caption]).toLowerCase().includes(q));$('stats').textContent=hits.length+' of '+posts.length+' scheduled posts · '+posts.reduce((a,p)=>a+p.slides.length,0)+' original/revised slide pairs · '+posts.filter(p=>p.hasVideo).length+' Reel storyboards';$('cards').innerHTML=hits.map(p=>`<article class="card"><img loading="lazy" src="${p.slides[0]?.revised??''}" alt="Revised cover for ${esc(p.id)}"><div class="cardbody"><div class="eyebrow">${p.date} · ${p.format.toUpperCase()} · ${p.id}</div><h3>${esc(p.title)}</h3><p>${esc(p.concept)}</p><button onclick="openPost('${p.id}')">Review post →</button></div></article>`).join('')}
function openPost(id){let p=posts.find(x=>x.id===id);$('modalTitle').textContent=p.date+' · '+p.id+' · '+p.format.toUpperCase();let markup=`<div class="copybox"><span class="label">PLANNED CAPTION</span><p>${esc(p.caption)}</p><p><b>Engagement prompt:</b> ${esc(p.cta)}</p><p class="small"><b>Creative objective:</b> ${esc(p.concept)}</p><button onclick="navigator.clipboard?.writeText(decodeURIComponent('${encodeURIComponent(p.caption.replaceAll("'",''))}'))">Copy caption</button></div>`;p.slides.forEach((s,i)=>{markup+=`<div class="slide"><h4>${p.format==='carousel'?'Slide '+(i+1):p.format==='reel'?'Reel cover':'Post artwork'} — original vs revised</h4><div class="pair"><div><div class="label">ORIGINAL PNG</div><img src="${s.original}" alt="Original"></div><div><div class="label">REVISED WEBP</div><img src="${s.revised}" alt="Revised"></div></div></div>`});if(p.scenes.length){markup+=`<h4>Reel storyboard — ${p.scenes.length} frames</h4><p class="small">Silent storyboard preview. Video motion and audio require separate sign-off.</p><div class="scenes">${p.scenes.map((s,i)=>`<div><span class="small">Scene ${i+1}</span><img src="${s}" loading="lazy"></div>`).join('')}</div>`}markup+=`<div class="copybox"><div class="label">CORRECTION / APPROVAL NOTES</div><textarea id="note" class="review" placeholder="Write precise corrections: framing, accuracy, wording, story, Reel pacing…">${esc(notes[p.id]||'')}</textarea><p><button onclick="notes['${p.id}']=$('note').value;alert('Notes saved for CSV export')">Save notes</button></p></div>`;$('modalBody').innerHTML=markup;$('modal').showModal()}
['q','format','week'].forEach(id=>$(id).addEventListener('input',draw));$('export').onclick=()=>{let lines=[['Post ID','Date','Format','Feedback'],...posts.filter(p=>notes[p.id]).map(p=>[p.id,p.date,p.format,notes[p.id]])];let csv=lines.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('
');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='BILAN_November_Corrections.csv';a.click()};draw();
</script></body></html>
